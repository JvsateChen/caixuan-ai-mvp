<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>采选AI · 登录</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .login-page {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
      padding: 20px;
    }
    .login-card {
      width: 100%; max-width: 420px;
      background: var(--surface); border: 1px solid var(--rule);
      border-radius: var(--r-xl); box-shadow: 0 8px 32px rgba(0,0,0,.08);
      overflow: hidden;
    }
    .login-header {
      text-align: center; padding: 32px 28px 20px;
    }
    .login-logo {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 1.3rem; font-weight: 700; color: var(--brand-1);
    }
    .login-header h1 {
      font-size: 1.4rem; font-weight: 700; margin: 16px 0 6px;
    }
    .login-header p {
      color: var(--muted); font-size: 0.88rem;
    }
    .login-tabs {
      display: flex; border-bottom: 1px solid var(--rule);
      margin: 0 28px;
    }
    .login-tab {
      flex: 1; text-align: center; padding: 12px 0;
      font-size: 0.92rem; font-weight: 500; color: var(--muted);
      border-bottom: 2px solid transparent; cursor: pointer;
      transition: all .2s;
    }
    .login-tab:hover { color: var(--ink); }
    .login-tab.active { color: var(--brand-1); border-bottom-color: var(--brand-1); }
    .login-body { padding: 24px 28px 28px; }
    .login-form { display: none; }
    .login-form.active { display: block; }
    .phone-prefix {
      display: flex; align-items: center; gap: 0; width: 100%;
      border: 1px solid var(--rule-2); border-radius: var(--r-sm);
      overflow: hidden; transition: border-color .2s;
    }
    .phone-prefix:focus-within { border-color: var(--brand-1); box-shadow: 0 0 0 3px var(--brand-soft); }
    .phone-prefix select {
      border: none; background: var(--surface-3); padding: 10px 8px;
      font-size: 0.9rem; color: var(--ink); cursor: pointer;
      border-right: 1px solid var(--rule);
    }
    .phone-prefix input {
      flex: 1; border: none; padding: 10px 12px;
      font-size: 0.9rem; color: var(--ink); background: var(--surface);
    }
    .phone-prefix input:focus { outline: none; }
    .code-row { display: flex; gap: 8px; }
    .code-row input { flex: 1; }
    .code-btn {
      flex-shrink: 0; padding: 10px 16px;
      font-size: 0.85rem; font-weight: 500; color: var(--brand-1);
      background: var(--brand-soft); border: 1px solid rgba(79,70,229,.15);
      border-radius: var(--r-sm); cursor: pointer; transition: all .2s;
      white-space: nowrap;
    }
    .code-btn:hover { background: rgba(79,70,229,.14); }
    .code-btn:disabled { color: var(--muted); cursor: not-allowed; opacity: 0.6; }
    .login-agree {
      display: flex; align-items: flex-start; gap: 8px;
      margin: 16px 0 20px; font-size: 0.8rem; color: var(--muted);
    }
    .login-agree a { color: var(--brand-1); text-decoration: none; }
    .login-agree a:hover { text-decoration: underline; }
    .wechat-qr {
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      padding: 20px 0;
    }
    .qr-box {
      width: 180px; height: 180px;
      border: 1px solid var(--rule); border-radius: var(--r-md);
      display: flex; align-items: center; justify-content: center;
      background: var(--surface-3); position: relative;
    }
    .qr-box svg { width: 140px; height: 140px; }
    .qr-scan-line {
      position: absolute; top: 0; left: 10px; right: 10px; height: 3px;
      background: linear-gradient(90deg, transparent, var(--brand-1), transparent);
      animation: qr-scan 2s ease-in-out infinite;
    }
    @keyframes qr-scan {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(170px); }
    }
    .qr-status { font-size: 0.88rem; color: var(--muted); text-align: center; }
    .qr-status .spinner { margin-right: 6px; }
    .login-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; color: var(--muted); font-size: 0.78rem;
    }
    .login-divider::before, .login-divider::after {
      content: ''; flex: 1; height: 1px; background: var(--rule);
    }
    .login-footer {
      text-align: center; padding: 16px 28px 24px;
      font-size: 0.8rem; color: var(--muted);
    }
    .login-footer a { color: var(--brand-1); text-decoration: none; }
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <!-- Logo + 标题 -->
      <div class="login-header">
        <a href="index.html" class="login-logo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h18l-2 12H5L3 3z"/><path d="M3 3l1.5-2h15L21 3"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg>
          采选AI
        </a>
        <h1>欢迎回来</h1>
        <p>登录后即可使用价格预警、比价历史等全部功能</p>
      </div>

      <!-- 登录方式切换 -->
      <div class="login-tabs">
        <div class="login-tab active" data-tab="phone">手机号登录</div>
        <div class="login-tab" data-tab="wechat">微信扫码</div>
      </div>

      <div class="login-body">
        <!-- 手机号+验证码 -->
        <form class="login-form active" id="phoneForm" onsubmit="return false">
          <div class="form-group">
            <label class="form-label">手机号</label>
            <div class="phone-prefix">
              <select id="prefix">
                <option value="+86">+86</option>
                <option value="+852">+852</option>
                <option value="+886">+886</option>
              </select>
              <input type="tel" id="phoneInput" placeholder="请输入手机号" maxlength="11">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">验证码</label>
            <div class="code-row">
              <input type="text" class="form-input" id="codeInput" placeholder="6位验证码" maxlength="6">
              <button type="button" class="code-btn" id="codeBtn">获取验证码</button>
            </div>
          </div>
          <div class="login-agree">
            <input type="checkbox" id="agreeCheck" checked style="margin-top:2px">
            <label for="agreeCheck">我已阅读并同意<a href="javascript:void(0)" data-action="agreement">《用户协议》</a>和<a href="javascript:void(0)" data-action="privacy">《隐私政策》</a></label>
          </div>
          <button type="submit" class="btn btn-primary" id="phoneSubmitBtn" style="width:100%;padding:11px;font-size:0.95rem">登录 / 注册</button>
        </form>

        <!-- 微信扫码 -->
        <div class="login-form" id="wechatForm">
          <div class="wechat-qr">
            <div class="qr-box">
              <svg viewBox="0 0 100 100" fill="none">
                <rect x="0" y="0" width="100" height="100" fill="#fff"/>
                <rect x="8" y="8" width="28" height="28" rx="2" fill="#333"/>
                <rect x="14" y="14" width="16" height="16" rx="1" fill="#fff"/>
                <rect x="18" y="18" width="8" height="8" fill="#333"/>
                <rect x="64" y="8" width="28" height="28" rx="2" fill="#333"/>
                <rect x="70" y="14" width="16" height="16" rx="1" fill="#fff"/>
                <rect x="74" y="18" width="8" height="8" fill="#333"/>
                <rect x="8" y="64" width="28" height="28" rx="2" fill="#333"/>
                <rect x="14" y="70" width="16" height="16" rx="1" fill="#fff"/>
                <rect x="18" y="74" width="8" height="8" fill="#333"/>
                <rect x="42" y="8" width="6" height="6" fill="#333"/>
                <rect x="52" y="8" width="4" height="4" fill="#333"/>
                <rect x="42" y="18" width="4" height="4" fill="#333"/>
                <rect x="50" y="20" width="6" height="6" fill="#333"/>
                <rect x="42" y="30" width="6" height="6" fill="#333"/>
                <rect x="8" y="42" width="6" height="6" fill="#333"/>
                <rect x="20" y="44" width="4" height="4" fill="#333"/>
                <rect x="28" y="42" width="6" height="6" fill="#333"/>
                <rect x="40" y="42" width="8" height="8" fill="#07c160"/>
                <rect x="52" y="42" width="6" height="6" fill="#333"/>
                <rect x="62" y="44" width="4" height="4" fill="#333"/>
                <rect x="70" y="42" width="6" height="6" fill="#333"/>
                <rect x="80" y="42" width="4" height="4" fill="#333"/>
                <rect x="42" y="54" width="4" height="4" fill="#333"/>
                <rect x="50" y="52" width="6" height="6" fill="#333"/>
                <rect x="60" y="54" width="4" height="4" fill="#333"/>
                <rect x="68" y="52" width="6" height="6" fill="#333"/>
                <rect x="80" y="54" width="4" height="4" fill="#333"/>
                <rect x="42" y="64" width="6" height="6" fill="#333"/>
                <rect x="52" y="66" width="4" height="4" fill="#333"/>
                <rect x="60" y="64" width="6" height="6" fill="#333"/>
                <rect x="70" y="66" width="4" height="4" fill="#333"/>
                <rect x="78" y="64" width="6" height="6" fill="#333"/>
                <rect x="42" y="76" width="4" height="4" fill="#333"/>
                <rect x="50" y="74" width="6" height="6" fill="#333"/>
                <rect x="60" y="76" width="4" height="4" fill="#333"/>
                <rect x="70" y="74" width="6" height="6" fill="#333"/>
                <rect x="80" y="76" width="4" height="4" fill="#333"/>
                <rect x="42" y="86" width="6" height="6" fill="#333"/>
                <rect x="52" y="88" width="4" height="4" fill="#333"/>
                <rect x="62" y="86" width="6" height="6" fill="#333"/>
                <rect x="72" y="88" width="4" height="4" fill="#333"/>
                <rect x="82" y="86" width="6" height="6" fill="#333"/>
              </svg>
              <div class="qr-scan-line"></div>
            </div>
            <div class="qr-status"><span class="spinner"></span> 请使用微信扫一扫登录</div>
          </div>
        </div>

        <div class="login-divider">其他登录方式</div>
        <div style="display:flex;justify-content:center;gap:16px">
          <button class="icon-btn" id="alipayBtn" title="支付宝登录" style="width:40px;height:40px;border-radius:50%;border:1px solid var(--rule)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="color:#1677ff"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79C5.73 13.38 9.08 14.5 12 14.5c2.92 0 6.27-1.12 5.79-2.29.13.58.21 1.17.21 1.79 0 4.08-3.05 7.44-7 7.93z"/></svg>
          </button>
          <button class="icon-btn" id="qqBtn" title="QQ登录" style="width:40px;height:40px;border-radius:50%;border:1px solid var(--rule)">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="color:#12b7f5"><path d="M12 2C8.5 2 6 5 6 8c0 .5 0 1 .2 1.5C5 10 4 11.5 4 13c0 1 .5 2 1.5 2.5C5 17 5 18.5 5.5 19.5c0 0 1.5-1 2.5-2 .5 0 1 .5 4 .5s3.5-.5 4-.5c1 1 2.5 2 2.5 2 .5-1 .5-2.5 0-4 1-.5 1.5-1.5 1.5-2.5 0-1.5-1-3-2.2-3.5.2-.5.2-1 .2-1.5 0-3-2.5-6-6-6z"/></svg>
          </button>
        </div>
      </div>

      <div class="login-footer">
        还没有账号？<a href="javascript:void(0)" id="registerLink">立即注册</a> · <a href="index.html">返回首页</a>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    /* ---- Tab 切换 ---- */
    document.querySelectorAll('.login-tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        document.querySelectorAll('.login-tab').forEach(function (t) { t.classList.remove('active'); });
        tab.classList.add('active');
        document.querySelectorAll('.login-form').forEach(function (f) { f.classList.remove('active'); });
        document.getElementById(tab.dataset.tab === 'phone' ? 'phoneForm' : 'wechatForm').classList.add('active');
      });
    });

    /* ---- 验证码倒计时 ---- */
    var codeBtn = document.getElementById('codeBtn');
    var codeTimer = null;

    /* ---- 手机号输入过滤(仅数字) ---- */
    document.getElementById('phoneInput').addEventListener('input', function (e) {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 11);
    });

    codeBtn.addEventListener('click', function () {
      var phone = document.getElementById('phoneInput').value.trim();
      if (!phone || phone.length < 11) {
        Toast.warning('请输入有效手机号', '手机号需为11位数字');
        return;
      }
      var count = 60;
      codeBtn.disabled = true;
      codeBtn.textContent = count + 's 后重发';
      codeTimer = setInterval(function () {
        count--;
        if (count <= 0) {
          clearInterval(codeTimer);
          codeBtn.disabled = false;
          codeBtn.textContent = '获取验证码';
        } else {
          codeBtn.textContent = count + 's 后重发';
        }
      }, 1000);
      Toast.info('验证码已发送', '请查收短信验证码（模拟）');
    });

    /* ---- 手机号登录提交 ---- */
    document.getElementById('phoneSubmitBtn').addEventListener('click', function () {
      var phone = document.getElementById('phoneInput').value.trim();
      var code = document.getElementById('codeInput').value.trim();
      if (!phone || phone.length < 11) { Toast.warning('请输入有效手机号', '手机号需为11位数字'); return; }
      if (!code || code.length < 6) { Toast.warning('验证码错误', '请输入6位验证码'); return; }
      if (!document.getElementById('agreeCheck').checked) { Toast.warning('请同意用户协议', '需勾选同意用户协议和隐私政策'); return; }
      var btn = this;
      var original = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> 登录中...';
      setTimeout(function () {
        Toast.success('登录成功', '欢迎回到采选AI');
        setTimeout(function () { window.location.href = 'index.html'; }, 800);
      }, 800);
    });

    /* ---- 注册链接 ---- */
    document.getElementById('registerLink').addEventListener('click', function (e) {
      e.preventDefault();
      Toast.info('注册', '请先通过手机号登录，系统将自动注册新账号');
    });

    /* ---- 第三方登录 ---- */
    document.getElementById('alipayBtn').addEventListener('click', function () {
      Toast.info('支付宝登录', '正在跳转至支付宝授权页面...');
    });
    document.getElementById('qqBtn').addEventListener('click', function () {
      Toast.info('QQ登录', '正在跳转至QQ授权页面...');
    });

    /* ---- 用户协议 / 隐私政策 ---- */
    document.querySelector('[data-action="agreement"]').addEventListener('click', function (e) {
      e.preventDefault();
      Toast.info('用户协议', '用户协议文档页面开发中');
    });
    document.querySelector('[data-action="privacy"]').addEventListener('click', function (e) {
      e.preventDefault();
      Toast.info('隐私政策', '隐私政策文档页面开发中');
    });
  </script>
</body>
</html>
